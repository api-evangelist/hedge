name: Hedge
description: >-
  Hedge is a decentralized, non-custodial lending protocol built on the Solana
  blockchain that lets users mint USH, a stablecoin soft-pegged to the US
  dollar. Users deposit collateral into vaults to take out 0% interest loans for
  a one-time fee, maintaining a collateral-to-debt ratio above 110% to avoid
  liquidation. A stability pool absorbs liquidations and rewards depositors with
  discounted collateral, while a Peg Stability Module and a multi-source oracle
  (Pyth Network primary, Switchboard fallback) keep USH near its peg. Hedge is
  an on-chain protocol rather than a hosted REST API; its documentation,
  whitepaper, and audited Solana program are its public surface. Backed by
  Pantera Capital and Y Combinator; smart contracts audited by Kudelski,
  OtterSec, and Sec3.
